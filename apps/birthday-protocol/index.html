<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>생일 축하 의전실</title>
<meta name="description" content="생일은 국빈 의전으로 모십니다.">
<meta property="og:title" content="국빈 의전 안내문이 도착했습니다">
<meta property="og:description" content="귀하의 생신을 맞아 최고 수준의 의전을 준비하였습니다.">
<meta property="og:image" content="https://brooksglobal.github.io/useless-things/apps/birthday-protocol/og.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&display=swap">
<link rel="stylesheet" href="../_shared/kit.css">
<style>
:root{--k-bg:#F7EFE3;--k-fg:#3A0A14;--k-sub:#7a5a52;--k-card:#fff;--k-line:#e3cdb0;--k-acc:#7A0F24;--k-acc-fg:#F2D27E;--k-focus:#7A0F24;
  --wine:#3A0A14;--wine2:#5C1020;--gold:#E8C26A;--gold2:#FFE7A6;--carpet:#B3122E;--paper:#FBF5E8;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(110% 60% at 50% 0%,#6a1426 0%,#3A0A14 55%,#1c0409 100%);color:#fff;font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.serif{font-family:"Nanum Myeongjo",serif}
/* 안내문 */
#gate{position:fixed;inset:0;display:grid;place-items:center;padding:24px;z-index:5}
.inv{background:var(--paper);color:#2a0a10;width:min(100%,350px);padding:30px 24px 24px;border-radius:4px;box-shadow:0 30px 60px rgba(0,0,0,.5);position:relative;outline:2px solid var(--gold);outline-offset:-10px}
.inv::before{content:"";position:absolute;inset:14px;border:1px solid rgba(160,110,40,.45);pointer-events:none}
.inv .k{text-align:center;font-size:11px;letter-spacing:.4em;color:#9a6a2a;font-weight:800}
.inv h1{text-align:center;font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:26px;letter-spacing:.18em;margin:8px 0 16px}
.inv .row{display:flex;font-size:14px;margin-top:8px;line-height:1.5}
.inv .row b{flex:none;width:52px;color:#8a6a5a}
.inv .body{margin-top:16px;font-family:"Nanum Myeongjo",serif;font-size:16px;line-height:1.75}
.inv button{display:block;width:100%;margin-top:22px;border:0;border-radius:4px;padding:15px;font:inherit;font-weight:800;font-size:17px;background:var(--wine2);color:var(--gold);cursor:pointer;letter-spacing:.1em}
/* 무대 */
#stage{position:fixed;inset:0;display:none;overflow:hidden}
#stage.on{display:block}
#carpet{position:absolute;left:0;right:0;bottom:0;height:62%;pointer-events:none}
#carpet i{position:absolute;inset:0;background:linear-gradient(180deg,#7d0c20 0%,#B3122E 60%,#c8203c 100%);clip-path:polygon(41% 0,59% 0,100% 100%,0 100%)}
#carpet.roll i{animation:roll 1s cubic-bezier(.2,.8,.3,1) both}
@keyframes roll{0%{clip-path:polygon(41% 0,59% 0,59% 0,41% 0)}100%{clip-path:polygon(41% 0,59% 0,100% 100%,0 100%)}}
#bar{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.04em;z-index:3}
#bar .lv{background:#e01e3c;padding:4px 8px;border-radius:3px;display:flex;align-items:center;gap:6px}
#bar .lv i{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#bar .tt{background:rgba(255,255,255,.12);padding:4px 8px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hd{position:absolute;top:calc(max(14px,env(safe-area-inset-top)) + 40px);left:0;right:0;text-align:center;z-index:3}
#hd h2{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:22px;color:var(--gold2);letter-spacing:.02em}
#hd p{font-size:12px;color:#d9a9a9;margin-top:3px;letter-spacing:.12em}
#order{position:absolute;top:calc(max(14px,env(safe-area-inset-top)) + 100px);left:14px;right:14px;display:flex;gap:4px;z-index:3}
#order span{flex:1;text-align:center;font-size:12px;font-weight:800;padding:7px 0;border-radius:3px;background:rgba(255,255,255,.08);color:#c79aa0;border:1px solid rgba(232,194,106,.2);transition:all .3s}
#order span.on{background:var(--gold);color:var(--wine);border-color:var(--gold);transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.35)}
#order span.done{color:#8f6a6f;text-decoration:line-through;text-decoration-color:rgba(232,194,106,.5)}
#scene{position:absolute;left:16px;right:16px;top:calc(max(14px,env(safe-area-inset-top)) + 148px);bottom:calc(max(14px,env(safe-area-inset-bottom)) + 120px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.lab{font-size:13px;letter-spacing:.4em;font-weight:900;color:var(--gold)}
/* 예포 */
.gun{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:150px;line-height:1;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 0 40px rgba(255,200,120,.6),0 8px 0 rgba(0,0,0,.3);margin:6px 0}
.gun.hit{animation:gh .16s ease-out}
@keyframes gh{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.gun small{font-size:36px;color:var(--gold)}
.gsub{font-size:15px;font-weight:700;color:#e6c3c3}
#flash{position:fixed;inset:0;background:#fff3d6;opacity:0;pointer-events:none;z-index:9}
#flash.on{animation:fl .22s ease-out}
@keyframes fl{0%{opacity:.55}100%{opacity:0}}
body.shake #stage{animation:shk .16s linear}
@keyframes shk{25%{transform:translate(-5px,3px)}50%{transform:translate(5px,-2px)}75%{transform:translate(-3px,-3px)}}
.puff{position:fixed;font-size:46px;pointer-events:none;z-index:4;animation:puff .7s ease-out forwards}
@keyframes puff{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.8) translateY(-30px);opacity:0}}
/* 팡파르 */
.tr{display:flex;gap:70px;font-size:84px;margin:14px 0}
.tr span{display:inline-block;animation:blow .36s ease-in-out infinite alternate}
.tr span:first-child{transform:scaleX(-1);animation-name:blowL}
@keyframes blow{0%{transform:rotate(-8deg)}100%{transform:rotate(6deg) translateY(-6px)}}
@keyframes blowL{0%{transform:scaleX(-1) rotate(-8deg)}100%{transform:scaleX(-1) rotate(6deg) translateY(-6px)}}
.note{position:fixed;font-size:30px;color:var(--gold2);pointer-events:none;z-index:4;animation:nt 1.6s ease-out forwards}
@keyframes nt{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--x),-220px) rotate(var(--r));opacity:0}}
.big{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:30px;color:#fff;line-height:1.35;margin-top:6px}
/* 의장대 */
.guard{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 10px;font-size:52px;margin:18px 0 10px}
.guard span{display:inline-block;opacity:0;animation:march .45s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes march{0%{transform:translateX(160px);opacity:0}100%{transform:none;opacity:1}}
.guard.salute span{animation:march .45s forwards,stomp .3s ease-out}
.guard.stomp span{animation:none;opacity:1;transform:translateY(-10px)}
.gsm{font-size:14px;color:#e6c3c3;font-weight:700;line-height:1.6}
/* 축사 */
.lect{background:var(--paper);color:#2a0a10;border-radius:4px;width:100%;max-width:360px;padding:22px 20px 20px;box-shadow:0 24px 50px rgba(0,0,0,.5);text-align:left;animation:drop .5s cubic-bezier(.2,1.3,.4,1) both}
.lect h3{text-align:center;font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:20px;letter-spacing:.5em;border-bottom:3px double #2a0a10;padding-bottom:10px;margin-bottom:10px}
.lect p{font-family:"Nanum Myeongjo",serif;font-size:16px;line-height:1.65;margin-top:7px;opacity:0;transform:translateY(6px);transition:all .45s}
.lect p.on{opacity:1;transform:none}
.lect p.sg{text-align:right;font-size:14px;color:#6a4a3a;margin-top:12px}
@keyframes drop{0%{transform:translateY(-30px) rotate(-2deg);opacity:0}100%{transform:none;opacity:1}}
/* 선물 */
.gift{position:relative;width:280px;height:250px;margin-top:4px}
.gift .cush{position:absolute;left:10px;right:10px;bottom:20px;height:96px;border-radius:50%/50%;background:radial-gradient(60% 55% at 45% 35%,#c22a48 0%,#7d0c20 70%,#4a0612 100%);box-shadow:0 26px 40px rgba(0,0,0,.55),inset 0 -10px 20px rgba(0,0,0,.35)}
.gift .cush::before,.gift .cush::after{content:"";position:absolute;bottom:4px;width:14px;height:42px;background:linear-gradient(180deg,var(--gold) 0 30%,#b88a2c 30% 100%);border-radius:3px 3px 6px 6px}
.gift .cush::before{left:-4px;transform:rotate(18deg)}.gift .cush::after{right:-4px;transform:rotate(-18deg)}
.gift .item{position:absolute;left:50%;bottom:72px;font-size:104px;line-height:1;transform:translateX(-50%) scale(.3);opacity:0;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))}
.gift.open .item{animation:itm .6s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes itm{to{transform:translateX(-50%) scale(1);opacity:1}}
.gift .cover{position:absolute;left:44px;right:44px;bottom:66px;height:150px;border-radius:50% 50% 10px 10px/70% 70% 10px 10px;background:linear-gradient(90deg,#b88a2c,#ffe7a6 40%,#d9ae54 60%,#a07422);box-shadow:inset 0 -12px 0 rgba(0,0,0,.18),0 10px 20px rgba(0,0,0,.35)}
.gift .cover::after{content:"";position:absolute;left:50%;top:-16px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:linear-gradient(135deg,#ffe7a6,#a07422)}
.gift.open .cover{animation:lift .9s cubic-bezier(.4,0,.2,1) forwards}
@keyframes lift{to{transform:translateY(-320px) rotate(-14deg);opacity:0}}
.gift .rays{position:absolute;left:50%;bottom:110px;width:420px;height:420px;margin:0 0 -210px -210px;background:repeating-conic-gradient(rgba(255,231,166,.22) 0 8deg,transparent 8deg 22deg);border-radius:50%;opacity:0;-webkit-mask:radial-gradient(circle,#000 20%,transparent 70%);mask:radial-gradient(circle,#000 20%,transparent 70%)}
.gift.open .rays{animation:rays 6s linear forwards}
@keyframes rays{0%{opacity:0;transform:rotate(0)}10%{opacity:1}100%{opacity:1;transform:rotate(60deg)}}
.gname{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:34px;color:var(--gold2);line-height:1.3;opacity:0;transform:translateY(10px);transition:all .5s}
.gname.on{opacity:1;transform:none}
.gfine{font-size:14px;color:#fff;background:rgba(0,0,0,.35);padding:3px 10px;border-radius:999px;margin-top:8px;opacity:0;transition:opacity .4s;font-weight:600}
.gfine.on{opacity:1}
.gby{font-size:12px;color:#c79aa0;letter-spacing:.2em;font-weight:800;margin-bottom:2px;opacity:0;transition:opacity .4s}
.gby.on{opacity:1}
.cf{position:fixed;top:-20px;width:9px;height:14px;z-index:6;pointer-events:none;animation:cf var(--d) linear forwards}
@keyframes cf{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--x),110vh) rotate(720deg)}}
#toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);background:var(--paper);color:var(--wine);font-weight:900;padding:16px 20px;border-radius:8px;z-index:60;box-shadow:0 20px 40px rgba(0,0,0,.4);text-align:center;line-height:1.4;display:none;width:max-content;max-width:300px}
</style>
</head>
<body>
<div id="app"></div>
<script src="../_shared/kit.js"></script>
<script>
K.start({
  parse: a => ({ to: K.str(a[0], '친구', 10), fr: K.str(a[1], '나', 10), gift: K.str(a[2], '아메리카노 한 잔', 14) }),
  make: () => K.maker({
    kicker: '생일 축하', title: '생일 축하 의전실', sub: '생일은 국빈 의전으로 모십니다.',
    fields: [
      { k: 'to', label: '생일인 사람', ph: '영집', max: 10, def: '친구' },
      { k: 'fr', label: '보내는 사람', ph: '현우', max: 10, def: '나' },
      { k: 'gift', label: '선물', ph: '아메리카노 한 잔', max: 14, def: '아메리카노 한 잔', hint: '비워 두면 아메리카노 한 잔입니다.' },
    ],
    toArr: v => [v.to, v.fr, v.gift],
  }),
  show,
});

function giftEmoji(g){ const M = [[/커피|아메리카노|라떼|카페/, '☕'], [/케이크|케잌/, '🎂'], [/꽃/, '💐'], [/치킨/, '🍗'], [/피자/, '🍕'], [/맥주|술|소주/, '🍺'], [/편지|마음/, '💌']];
  for (const [r, e] of M) if (r.test(g)) return e; return '🎁'; }

function show(d){
  const E = K.esc, to = E(d.to), fr = E(d.fr);
  document.getElementById('app').innerHTML =
    '<div id="gate"><div class="inv"><p class="k">STATE PROTOCOL</p><h1>의전 안내문</h1>' +
    '<p class="row"><b>국빈</b>' + to + ' 님</p><p class="row"><b>주최</b>생일 축하 의전실 (실장 ' + fr + ')</p>' +
    '<p class="body">' + to + ' 님의 생신을 맞아 최고 수준의 의전을 준비하였습니다. 입장하시면 행사가 바로 시작됩니다.</p>' +
    '<button id="enter">입장</button></div></div>' +
    '<div id="stage"><div id="carpet"><i></i></div>' +
    '<div id="bar"><span class="lv"><i></i>LIVE</span><span class="tt">' + to + ' 님 생신 국빈 의전 생중계</span></div>' +
    '<div id="hd"><h2>' + to + ' 님 생신 국빈 의전</h2><p>주최 생일 축하 의전실</p></div>' +
    '<div id="order"><span>예포</span><span>팡파르</span><span>의장대</span><span>축사</span><span>선물</span></div>' +
    '<div id="scene"></div></div><div id="flash"></div><div id="toast"></div>';
  K.footer({ dark: true });
  K.$('#enter').onclick = () => { K.unlock(); K.$('#gate').remove(); K.$('#stage').classList.add('on'); K.$('#carpet').classList.add('roll'); run(d); };
}

function step(i){ K.$$('#order span').forEach((s, j) => { s.classList.toggle('on', j === i); s.classList.toggle('done', j < i); }); K.tone(988, .08, { type: 'sine', vol: .14 }); K.tone(1480, .12, { type: 'sine', vol: .1, at: .07 }); }
function shake(){ document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake'); const f = K.$('#flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); }
function drum(n, gap, at = 0, v = .5){ for (let i = 0; i < n; i++) K.noise(.06, { bp: 2200, q: .8, vol: v * (.6 + .4 * i / n), at: at + i * gap }); }

async function run(d){
  const S = K.sleep, sc = K.$('#scene'), E = K.esc, to = E(d.to), fr = E(d.fr);
  await S(700);
  // 1) 예포 21발
  step(0);
  sc.innerHTML = '<p class="lab">예포 발사</p><p class="gun" id="gun">0<small>발</small></p><p class="gsub">' + to + ' 님 생신 기념 예포 21발</p>';
  await S(600);
  let gap = 470;
  for (let n = 1; n <= 21; n++) {
    const g = K.$('#gun'); g.innerHTML = n + '<small>발</small>'; g.classList.remove('hit'); void g.offsetWidth; g.classList.add('hit');
    K.boom({ vol: n === 21 ? 1 : .55 + n * .012, f: n === 21 ? 80 : 120, d: n === 21 ? 1.1 : .45 }); shake(); K.vibe(20);
    if (n % 2 || n === 21) { const p = document.createElement('div'); p.className = 'puff'; p.textContent = '💨'; p.style.left = (n % 4 < 2 ? K.rand(4, 22) : K.rand(68, 86)) + '%'; p.style.top = K.rand(58, 72) + '%'; document.body.appendChild(p); setTimeout(() => p.remove(), 720); }
    await S(gap); gap = Math.max(75, gap * .85);
  }
  K.$('.gsub').textContent = '이상 21발. 이웃 주민께 양해를 구합니다.';
  await S(1100);
  // 2) 팡파르 (가상의 곡)
  step(1);
  sc.innerHTML = '<p class="lab">팡파르</p><div class="tr"><span>🎺</span><span>🎺</span></div><p class="big">' + to + ' 님<br>입장하십니다</p>';
  const G4 = 392, C5 = 523, E5 = 659, G5 = 784, A5 = 880, C6 = 1047, q = .16;
  const end = K.fanfare([[G4, q], [C5, q], [E5, q], [G5, q * 2], [0, q * .5], [E5, q], [G5, q * 3], [0, q * .5], [A5, q], [G5, q], [E5, q], [C6, q * 5]], { vol: .11 });
  drum(14, .1, 0, .35); K.boom({ vol: .5, at: end - q * 5 });
  for (let i = 0; i < 10; i++) setTimeout(() => { const n = document.createElement('div'); n.className = 'note'; n.textContent = K.pick(['♪', '♫', '♬']); n.style.left = K.rand(15, 80) + '%'; n.style.top = K.rand(42, 55) + '%'; n.style.setProperty('--x', K.rand(-60, 60) + 'px'); n.style.setProperty('--r', K.rand(-40, 40) + 'deg'); document.body.appendChild(n); setTimeout(() => n.remove(), 1650); }, i * 230);
  await S(end * 1000 + 700);
  // 3) 의장대 사열
  step(2);
  sc.innerHTML = '<p class="lab">의장대 사열</p><div class="guard" id="gd">' + Array.from({ length: 8 }, (_, i) => '<span style="animation-delay:' + (i * .16) + 's">💂</span>').join('') + '</div><p class="gsm">의장대 8명 · 지휘 ' + fr + '<br>' + to + ' 님 앞으로 사열하겠습니다</p>';
  for (let i = 0; i < 8; i++) { K.noise(.08, { lp: 500, vol: .7, at: i * .16 }); K.tone(90, .08, { type: 'sine', vol: .5, at: i * .16 }); }
  await S(1650);
  const gd = K.$('#gd'); gd.classList.add('stomp'); K.boom({ vol: .7, f: 140, d: .3 }); K.noise(.1, { bp: 3000, vol: .5 }); K.vibe(30);
  K.$('.gsm').innerHTML = '받들어 — 축하!<br>' + to + ' 님 생신 축하합니다';
  await S(250); gd.classList.remove('stomp');
  await S(1050);
  // 4) 축사
  step(3);
  const yy = new Date(); const ds = yy.getFullYear() + '. ' + (yy.getMonth() + 1) + '. ' + yy.getDate() + '.';
  const L = [
    '친애하는 ' + to + ' 님.',
    '오늘은 ' + to + ' 님께서 이 땅에 오신 날입니다.',
    '지난 1년간 ' + to + ' 님은 하루도 빠짐없이 숨을 쉬셨습니다.',
    '그 노고에 깊은 경의를 표합니다.',
    '이에 ' + fr + K.josa(d.fr, '은', '는') + ' 최고 예우에 걸맞은 선물을 준비하였습니다.',
  ];
  sc.innerHTML = '<div class="lect"><h3>축 사</h3>' + L.map(t => '<p>' + t + '</p>').join('') + '<p class="sg">' + ds + '<br>생일 축하 의전실장 ' + fr + '</p></div>';
  await S(600);
  const ps = K.$$('.lect p');
  for (const p of ps) { p.classList.add('on'); K.tone(220, .5, { type: 'triangle', vol: .08 }); K.tone(330, .5, { type: 'triangle', vol: .05, at: .02 }); await S(p.classList.contains('sg') ? 800 : 1080); }
  await S(500);
  // 5) 선물 증정
  step(4);
  sc.innerHTML = '<p class="gby" id="gby">증정 · ' + fr + '</p><div class="gift" id="gf"><div class="rays"></div><div class="cush"></div><div class="item">' + giftEmoji(d.gift) + '</div><div class="cover"></div></div>' +
    '<p class="gname" id="gn">' + E(d.gift) + '</p><p class="gfine" id="gfi">(기프티콘 아님)</p>';
  await S(400); K.$('#gby').classList.add('on');
  drum(26, .07, 0, .55); for (let i = 0; i < 26; i++) K.tone(70, .06, { type: 'sine', vol: .3, at: i * .07 });
  await S(1700);
