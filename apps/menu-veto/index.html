<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>메뉴 거부권 룰렛</title>
<meta name="description" content="아무거나라고 한 사람에게 거부권을 드립니다.">
<meta property="og:title" content="메뉴 결정 회의에 초대되었습니다">
<meta property="og:description" content="귀하에게 거부권 3장이 지급되었습니다.">
<meta property="og:image" content="https://brooksglobal.github.io/useless-things/apps/menu-veto/og.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../_shared/kit.css">
<style>
:root{--k-bg:#EAF1FA;--k-fg:#0E2747;--k-sub:#4f6480;--k-card:#fff;--k-line:#c9d6e6;--k-acc:#1F5FAE;--k-acc-fg:#fff;--k-focus:#1F5FAE;
  --navy:#0E2747;--navy2:#071630;--blue:#4B92DB;--sky:#9CC7F0;--red:#D7263D;--paper:#F7F9FC;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(110% 60% at 50% 0%,#1b3f6d 0%,#0E2747 58%,#061227 100%);color:#fff;font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
/* 초대장 */
#gate{position:fixed;inset:0;display:grid;place-items:center;padding:24px;z-index:5}
.inv{background:var(--paper);color:#0E2747;width:min(100%,350px);padding:26px 22px 22px;border-radius:6px;box-shadow:0 30px 60px rgba(0,0,0,.5);text-align:center}
.inv .em{width:64px;height:64px;margin:0 auto 6px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-size:34px}
.inv .k{font-size:11px;letter-spacing:.3em;color:#4f6480;font-weight:800}
.inv h1{font-size:24px;font-weight:900;margin:8px 0 12px}
.inv .row{display:flex;font-size:14px;margin-top:6px;line-height:1.5;text-align:left}
.inv .row b{flex:none;width:64px;color:#6a7f99}
.inv .body{margin-top:12px;font-size:15px;line-height:1.65;text-align:left}
.inv button{display:block;width:100%;margin-top:20px;border:0;border-radius:6px;padding:15px;font:inherit;font-weight:800;font-size:17px;background:var(--blue);color:#fff;cursor:pointer;letter-spacing:.1em}
/* 회의장 */
#stage{position:fixed;inset:0;display:none;overflow:hidden}
#stage.on{display:block}
#bar{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;z-index:3}
#bar .lv{background:#e01e3c;padding:4px 8px;border-radius:3px;display:flex;align-items:center;gap:6px}
#bar .lv i{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#bar .tt{background:rgba(255,255,255,.12);padding:4px 8px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hd{position:absolute;top:calc(max(14px,env(safe-area-inset-top)) + 40px);left:0;right:0;text-align:center;z-index:3}
#hd h2{font-weight:900;font-size:21px;color:#fff}
#hd p{font-size:12px;color:var(--sky);margin-top:3px;letter-spacing:.06em}
#cards{position:absolute;top:calc(max(14px,env(safe-area-inset-top)) + 98px);left:14px;right:14px;display:flex;gap:6px;z-index:3;align-items:center}
#cards .lb{font-size:12px;font-weight:800;color:var(--sky);flex:none;margin-right:2px}
.vc{flex:1;height:40px;border-radius:6px;background:linear-gradient(180deg,#5aa2ea,#2f74c0);display:grid;place-items:center;font-size:13px;font-weight:900;letter-spacing:.06em;box-shadow:0 4px 0 #1b4f8c;transition:all .35s;position:relative}
.vc.used{background:#2a3a52;color:#6f819b;box-shadow:0 4px 0 #1a2638;transform:translateY(3px)}
.vc.used::after{content:"사용";position:absolute;inset:0;display:grid;place-items:center;color:var(--red);font-size:15px;transform:rotate(-12deg);border:2px solid var(--red);border-radius:6px;margin:5px 14px}
.vc.flip{animation:flip .4s ease}
@keyframes flip{50%{transform:rotateX(90deg)}}
#scene{position:absolute;left:14px;right:14px;top:calc(max(14px,env(safe-area-inset-top)) + 150px);bottom:calc(max(14px,env(safe-area-inset-bottom)) + 120px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
#wrapW{position:relative;width:min(84vw,292px);aspect-ratio:1}
#wheel{position:absolute;inset:0;border-radius:50%;border:6px solid #fff;box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 0 0 3px rgba(0,0,0,.15)}
#wheel .lab{position:absolute;left:50%;top:50%;width:0;height:0}
#wheel .lab span{position:absolute;left:-40px;width:80px;text-align:center;top:-118px;font-weight:900;font-size:16px;color:#0E2747;line-height:1.1}
#wheel .lab span i{display:block;font-style:normal;font-size:22px;margin-bottom:2px}
#hub{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.3);display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--navy)}
#pin{position:absolute;left:50%;top:-14px;margin-left:-14px;width:28px;height:34px;background:var(--red);clip-path:polygon(0 0,100% 0,50% 100%);z-index:2;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
#pick{margin-top:12px;min-height:30px;font-size:18px;font-weight:900;text-align:center}
#pick .x{color:var(--red);border:3px solid var(--red);padding:0 8px;border-radius:4px;margin-left:8px;display:inline-block;transform:rotate(-8deg);animation:stp .25s cubic-bezier(.3,1.6,.5,1)}
@keyframes stp{0%{transform:scale(2.4) rotate(-8deg);opacity:0}100%{transform:rotate(-8deg);opacity:1}}
#why{font-size:13px;color:var(--sky);font-weight:700;min-height:18px;margin-top:2px}
#veto{position:absolute;left:24px;right:24px;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 66px);border:0;border-radius:10px;padding:14px;font:inherit;font-size:17px;font-weight:900;background:var(--red);color:#fff;box-shadow:0 5px 0 #8e1426;cursor:pointer;z-index:4;opacity:.35;pointer-events:none;transition:opacity .2s}
#veto.on{opacity:1;pointer-events:auto}
#veto:active{transform:translateY(3px);box-shadow:0 2px 0 #8e1426}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
#flash.on{animation:fl .22s ease-out}
@keyframes fl{0%{opacity:.5}100%{opacity:0}}
body.shake #stage{animation:shk .16s linear}
@keyframes shk{25%{transform:translate(-5px,3px)}50%{transform:translate(5px,-2px)}75%{transform:translate(-3px,-3px)}}
#out{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.6);background:var(--red);color:#fff;font-weight:900;font-size:22px;padding:14px 22px;border-radius:8px;z-index:8;opacity:0;white-space:nowrap;box-shadow:0 20px 40px rgba(0,0,0,.45)}
#out.on{animation:out 1.4s ease forwards}
@keyframes out{0%{opacity:0;transform:translate(-50%,-50%) scale(1.8)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
/* 결과 */
#res{position:fixed;inset:0;z-index:7;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(6,18,39,.86)}
#res.on{display:flex}
#res .k{font-size:13px;letter-spacing:.3em;color:var(--sky);font-weight:800}
#res .menu{font-size:120px;line-height:1;margin:14px 0 4px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:none;opacity:1}}
#res .nm{font-size:46px;font-weight:900}
#res .ok{display:inline-block;margin-top:10px;border:4px solid var(--red);color:var(--red);font-size:26px;font-weight:900;padding:2px 14px;border-radius:6px;transform:rotate(-8deg);opacity:0}
#res .ok.on{animation:stp .3s cubic-bezier(.3,1.6,.5,1) forwards}
#res .fine{font-size:17px;font-weight:800;color:#FFE08A;background:rgba(255,255,255,.12);padding:7px 14px;border-radius:999px;margin-top:18px;opacity:0;transition:opacity .4s;line-height:1.5}
#res .fine.on{opacity:1}
#toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);background:var(--paper);color:var(--navy);font-weight:900;padding:16px 20px;border-radius:8px;z-index:60;box-shadow:0 20px 40px rgba(0,0,0,.4);text-align:center;line-height:1.4;display:none;width:max-content;max-width:300px}
</style>
</head>
<body>
<div id="app"></div>
<script src="../_shared/kit.js"></script>
<script>
const EMO = [[/회|사시미|초밥|스시/, '🐟'], [/치킨|닭/, '🍗'], [/삼겹|고기|갈비/, '🥩'], [/마라/, '🌶️'], [/피자/, '🍕'], [/국밥|탕|찌개/, '🍲'], [/짜장|짬뽕|중식/, '🍜'], [/떡볶이/, '🍢'], [/버거|햄버거/, '🍔'], [/곱창|막창/, '🔥'], [/족발|보쌈/, '🐷'], [/샐러드/, '🥗']];
const emo = m => { for (const [r, e] of EMO) if (r.test(m)) return e; return '🍽️'; };
const BASE = ['치킨', '삼겹살', '마라탕', '피자', '국밥', '짜장면', '떡볶이', '햄버거', '족발'];
const WHY = ['어제 먹음', '옷에 냄새 뱀', '오늘은 좀 매움', '그냥'];
let W = [], ang = 0;

function show(d){
  const E = K.esc, to = E(d.to), fr = E(d.fr);
  const others = BASE.filter(m => m !== d.hate && !d.hate.includes(m) && !m.includes(d.hate));
  W = [others[0], others[4], others[1], others[5], others[2], others[6], d.hate, others[3]];   // 8칸, 싫은 메뉴는 6번
  const col = ['#FFFFFF', '#D6E8FA'];
  const grad = 'conic-gradient(' + W.map((m, i) => col[i % 2] + ' ' + (i * 45) + 'deg ' + ((i + 1) * 45) + 'deg').join(',') + ')';
  document.getElementById('app').innerHTML =
    '<div id="gate"><div class="inv"><div class="em">🍽️</div><p class="k">MENU SECURITY COUNCIL</p><h1>메뉴 결정 회의</h1>' +
    '<p class="row"><b>상임이사</b>' + to + ' 님</p><p class="row"><b>소집</b>' + fr + '</p>' +
    '<p class="body">' + to + ' 님이 「아무거나」라고 하셔서 회의를 열었습니다. 공정한 결정을 위해 <b>거부권 3장</b>을 지급합니다.</p>' +
    '<button id="enter">회의 입장</button></div></div>' +
    '<div id="stage">' +
    '<div id="bar"><span class="lv"><i></i>LIVE</span><span class="tt">오늘 저녁 메뉴 결정 회의 생중계</span></div>' +
    '<div id="hd"><h2>오늘 저녁 메뉴 결정 회의</h2><p>상임이사 ' + to + ' · 안건: 아무거나</p></div>' +
    '<div id="cards"><span class="lb">거부권</span><span class="vc">VETO</span><span class="vc">VETO</span><span class="vc">VETO</span></div>' +
    '<div id="scene"><div id="wrapW"><div id="pin"></div><div id="wheel" style="background:' + grad + '">' +
    W.map((m, i) => '<div class="lab" style="transform:rotate(' + (i * 45 + 22.5) + 'deg)"><span><i>' + emo(m) + '</i>' + E(m) + '</span></div>').join('') +
    '</div><div id="hub">룰렛</div></div><p id="pick"></p><p id="why"></p></div>' +
    '<button id="veto">거부권 행사</button></div>' +
    '<div id="out"></div><div id="res"></div><div id="flash"></div><div id="toast"></div>';
  K.footer({ dark: true });
  K.$('#enter').onclick = () => { K.unlock(); K.$('#gate').remove(); K.$('#stage').classList.add('on'); run(d); };
}

function shake(){ document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake'); const f = K.$('#flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); }
// idx 칸이 핀(위)에 오도록 dur 초 동안 turns 바퀴 돌림. 칸이 바뀔 때마다 똑딱.
function spin(idx, turns, dur){
  return new Promise(res => {
    const from = ang, target = Math.ceil(from / 360) * 360 + turns * 360 + (360 - (idx * 45 + 22.5)) + K.rand(-12, 12);
    const t0 = performance.now(); let last = -1;
    const f = () => {
      const p = Math.min(1, (performance.now() - t0) / (dur * 1000)), e = 1 - Math.pow(1 - p, 3.2);
      ang = from + (target - from) * e; K.$('#wheel').style.transform = 'rotate(' + ang + 'deg)';
      const s = Math.floor(((360 - (ang % 360)) % 360) / 45); if (s !== last) { last = s; K.tick({ f: 1500, vol: .05 }); }
      p < 1 ? requestAnimationFrame(f) : res();
    };
    requestAnimationFrame(f);
  });
}
function waitVeto(){ return new Promise(r => { const b = K.$('#veto'); b.classList.add('on'); b.onclick = () => { b.classList.remove('on'); b.onclick = null; r(); }; }); }

async function run(d){
  const S = K.sleep, E = K.esc, to = E(d.to);
  await S(500);
  const order = [0, 2, 4];   // 치킨 → 삼겹살 → 마라탕 자리
  for (let k = 0; k < 3; k++) {
    K.$('#pick').innerHTML = ''; K.$('#why').textContent = '';
    K.tone(660, .08, { type: 'sine', vol: .12 });
    await spin(order[k], 3 + k, 2.4);
    K.ding({ f: 1046, vol: .18 });
    K.$('#pick').innerHTML = emo(W[order[k]]) + ' ' + E(W[order[k]]);
    await waitVeto();
    const c = K.$$('#cards .vc')[k]; c.classList.add('flip'); setTimeout(() => c.classList.add('used'), 200);
    K.$('#pick').innerHTML = emo(W[order[k]]) + ' ' + E(W[order[k]]) + '<span class="x">거부</span>';
    K.$('#why').textContent = '거부 사유: ' + WHY[k];
    K.noise(.1, { lp: 500, vol: 1 }); K.tone(80, .25, { type: 'sine', vol: .8 }); shake(); K.vibe(30);
    await S(900);
  }
  // 거부권 소진
  const o = K.$('#out'); o.textContent = '거부권 소진'; o.classList.add('on');
  K.tone(330, .25, { type: 'square', vol: .1 }); K.tone(247, .5, { type: 'square', vol: .1, at: .25 });
  K.$('#pick').innerHTML = ''; K.$('#why').textContent = '';
  await S(1300);
  K.$('#hub').textContent = '최종';
  K.$('#why').textContent = '최종 결정 · 거부권 없음';
  for (let i = 0; i < 10; i++) K.noise(.05, { bp: 2000, vol: .3, at: i * .09 });
  await spin(6, 5, 3.6);
  K.boom({ vol: .9, f: 90, d: .8 }); shake(); K.vibe(50);
  K.$('#pick').innerHTML = emo(d.hate) + ' ' + E(d.hate);
  await S(700);
  const r = K.$('#res');
  r.innerHTML = '<p class="k">오늘 저녁 메뉴</p><p class="menu">' + emo(d.hate) + '</p><p class="nm">' + E(d.hate) + '</p><p class="ok" id="ok">확정</p>' +
    '<p class="fine" id="fine">' + to + ' 님은 ' + E(d.hate) + K.josa(d.hate, '이', '가') + ' 싫다고 하셨지만<br>남은 거부권이 없습니다</p>';
  r.classList.add('on');
  K.fanfare([[523, .12], [659, .12], [784, .12], [1047, .7]], { vol: .11 });
  await S(800); K.$('#ok').classList.add('on'); K.noise(.12, { lp: 400, vol: 1 }); K.tone(70, .2, { type: 'sine', vol: .7 });
  await S(1000); K.$('#fine').classList.add('on'); K.tone(1200, .05, { type: 'square', vol: .05 });
  await S(1500);
  K.again({ replayText: '재심 요청', makeText: '나도 회의 열기', onReplay: () => {
    const t = K.$('#toast'); t.innerHTML = '재심 요청은 거부권이 필요합니다.<br>남은 거부권: 0장'; t.style.display = 'block'; K.tone(196, .4, { type: 'square', vol: .08 });
    setTimeout(() => { t.style.display = 'none'; K.$('.k-again').classList.add('on'); }, 2400); } });
}
K.start({
  parse: a => ({ to: K.str(a[0], '친구', 10), fr: K.str(a[1], '나', 10), hate: K.str(a[2], '회', 8) }),
  make: () => K.maker({
    kicker: '메뉴 결정', title: '메뉴 거부권 룰렛', sub: '「아무거나」라고 한 사람에게 거부권을 드립니다.',
    fields: [
      { k: 'to', label: '「아무거나」라고 한 사람', ph: '윤섭', max: 10, def: '친구' },
      { k: 'fr', label: '보내는 사람', ph: '현우', max: 10, def: '나' },
      { k: 'hate', label: '그 사람이 싫다고 한 메뉴', ph: '회', max: 8, def: '회', hint: '비워 두면 회입니다.' },
    ],
    toArr: v => [v.to, v.fr, v.hate],
  }),
  show,
});
</script>
</body>
</html>
