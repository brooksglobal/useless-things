<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>약속장소 국토교통부</title>
<meta name="description" content="두 사람의 공정한 중간 지점을 국책 사업으로 정합니다.">
<meta property="og:title" content="약속장소 최종 입지 발표">
<meta property="og:description" content="귀하의 약속장소가 국책 사업으로 선정되었습니다. 브리핑을 시청해 주세요.">
<meta property="og:image" content="https://brooksglobal.github.io/useless-things/apps/midpoint/og.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&display=swap">
<link rel="stylesheet" href="../_shared/kit.css">
<style>
:root{--k-bg:#EEF2F7;--k-fg:#0B2545;--k-sub:#5b6b82;--k-card:#fff;--k-line:#cfd8e6;--k-acc:#0B2545;--k-acc-fg:#fff;--k-focus:#0B2545;
  --navy:#0B2545;--navy2:#13315C;--sky:#8DA9C4;--orange:#F28C28;--a:#E5484D;--b:#2F7DF6;--land:#EFE8D6;--river:#5AA9E6;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:linear-gradient(180deg,#13315C 0%,#0B2545 60%,#081a33 100%);color:#fff;font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
/* 보도자료 */
#gate{position:fixed;inset:0;display:grid;place-items:center;padding:24px;z-index:5}
.pr{background:#fff;color:#111;width:min(100%,350px);border-radius:3px;box-shadow:0 30px 60px rgba(0,0,0,.5);padding:22px 20px 20px;border-top:8px solid var(--navy)}
.pr .k{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:#5b6b82}
.pr .k b{color:#fff;background:var(--a);padding:2px 6px;border-radius:2px;letter-spacing:.06em}
.pr h1{font-size:28px;font-weight:900;letter-spacing:.2em;margin:12px 0 12px;color:var(--navy)}
.pr .t{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:19px;line-height:1.5;border-top:2px solid #111;border-bottom:1px solid #ccc;padding:12px 0}
.pr .rw{display:flex;font-size:13px;margin-top:8px;color:#333}
.pr .rw b{flex:none;width:52px;color:#888}
.pr button{display:block;width:100%;margin-top:18px;border:0;border-radius:4px;padding:15px;font:inherit;font-weight:900;font-size:17px;background:var(--navy);color:#fff;cursor:pointer}
/* 브리핑 */
#stage{position:fixed;inset:0;display:none}
#stage.on{display:block}
#bar{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.04em}
#bar .lv{background:var(--a);padding:4px 8px;border-radius:3px;display:flex;align-items:center;gap:6px}
#bar .lv i{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#bar .tt{background:rgba(255,255,255,.12);padding:4px 8px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hd{position:absolute;top:calc(max(14px,env(safe-area-inset-top)) + 36px);left:16px;right:16px}
#hd p{font-size:12px;color:var(--sky);font-weight:800;letter-spacing:.2em}
#hd h2{font-size:21px;font-weight:900;line-height:1.3;margin-top:3px}
#map{position:absolute;left:14px;right:14px;top:calc(max(14px,env(safe-area-inset-top)) + 100px);height:290px;border-radius:10px;overflow:hidden;background:var(--land);box-shadow:0 14px 30px rgba(0,0,0,.35)}
#map svg{width:100%;height:100%;display:block}
#mg{transition:transform 1.4s cubic-bezier(.6,0,.2,1);transform-origin:181px 145px}
#mg.zoom{transform:scale(2.6)}
#lnm{transition:stroke-dashoffset 1.1s ease-in-out,stroke-width 1.4s}
#mg.zoom #lnm{stroke-width:1}
.pt{transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .45s cubic-bezier(.2,1.8,.4,1)}
.pt.on{transform:scale(1)}
#ln{stroke-dasharray:4 7;stroke-dashoffset:0}
#lnm{stroke-dasharray:400;stroke-dashoffset:400;transition:stroke-dashoffset 1.1s ease-in-out}
#lnm.on{stroke-dashoffset:0}
#q{opacity:0;transition:opacity .3s}
#q.on{opacity:1;animation:qb .6s steps(2) infinite}
@keyframes qb{50%{opacity:.3}}
.rip{fill:none;stroke:#fff;stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:rip 1.4s ease-out forwards}
@keyframes rip{0%{transform:scale(.2);opacity:1}100%{transform:scale(2.4);opacity:0}}
#pin{position:absolute;left:50%;top:50%;font-size:56px;line-height:1;transform:translate(-50%,-260px);opacity:0;pointer-events:none;filter:drop-shadow(0 8px 6px rgba(0,0,0,.35))}
#pin.drop{animation:pin .55s cubic-bezier(.5,0,.8,.6) forwards}
@keyframes pin{0%{transform:translate(-50%,-260px);opacity:1}100%{transform:translate(-50%,-100%);opacity:1}}
#pin.sink{animation:sink 1.6s ease-in forwards}
@keyframes sink{0%{transform:translate(-50%,-100%);opacity:1}100%{transform:translate(-50%,-55%);opacity:.55;clip-path:inset(0 0 45% 0)}}
.tag{position:absolute;left:10px;top:10px;background:var(--navy);color:#fff;font-size:11px;font-weight:800;padding:4px 8px;border-radius:3px;letter-spacing:.06em}
/* 지표 */
#pan{position:absolute;left:14px;right:14px;top:calc(max(14px,env(safe-area-inset-top)) + 402px);bottom:calc(max(14px,env(safe-area-inset-bottom)) + 118px);display:flex;flex-direction:column}
.ix{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:12px 14px;animation:up .4s both}
@keyframes up{0%{transform:translateY(16px);opacity:0}100%{transform:none;opacity:1}}
.ix h4{display:flex;justify-content:space-between;font-size:13px;font-weight:900;letter-spacing:.12em;color:var(--sky);margin-bottom:6px}
.ix h4 span{color:#fff;letter-spacing:0;font-variant-numeric:tabular-nums}
.ir{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:13px;font-weight:700}
.ir>span{flex:none;width:64px;color:#d6e0ee}
.ir .tr{flex:1;height:14px;border-radius:3px;overflow:hidden;display:flex;position:relative}
.ir .tr i{display:block;height:100%;background:var(--a);transition:width .28s ease-in-out}
.ir .tr b{flex:1;background:var(--b)}
.ir .tr::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:#fff;opacity:.7}
.lg{display:flex;justify-content:space-between;font-size:11px;font-weight:800;margin-top:8px}
.lg .x{color:#ff8a8d}.lg .y{color:#8fbaff}
/* 발표 */
.ann{background:#fff;color:var(--navy);border-radius:10px;padding:16px 16px 14px;text-align:center;position:relative;overflow:hidden;animation:up .45s cubic-bezier(.2,1.3,.4,1) both;box-shadow:0 16px 36px rgba(0,0,0,.4)}
.ann small{display:block;font-size:12px;font-weight:900;letter-spacing:.3em;color:var(--orange)}
.ann h3{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:31px;line-height:1.3;margin-top:4px}
.ann .dp{font-size:16px;font-weight:800;color:#2f6aa6;margin-top:2px}
.tape{position:relative;height:26px;margin:12px -16px 0;transition:height .3s .9s,margin .3s .9s}
.tape.cut{height:0;margin-top:4px}
.tape i{position:absolute;top:0;height:26px;width:50%;background:repeating-linear-gradient(-45deg,#F2C14E 0 12px,#1b1b1b 12px 24px);transition:transform .7s cubic-bezier(.4,0,.6,1),opacity .7s}
.tape i:nth-of-type(1){left:0;transform-origin:0 50%}.tape i:nth-of-type(2){right:0;transform-origin:100% 50%}
.tape.cut i:nth-of-type(1){transform:rotate(28deg) translateY(10px);opacity:0}
.tape.cut i:nth-of-type(2){transform:rotate(-28deg) translateY(10px);opacity:0}
.tape em{position:absolute;top:-12px;left:-44px;font-size:40px;font-style:normal;transition:left .6s cubic-bezier(.5,0,.5,1);z-index:2}
.tape.go em{left:calc(50% - 22px)}
.tape.cut em{animation:snip .25s 2,fade .4s .6s forwards}
@keyframes fade{to{opacity:0}}
@keyframes snip{50%{transform:rotate(-25deg)}}
.dig{display:flex;justify-content:center;gap:16px;font-size:34px;margin-top:6px;height:0;overflow:hidden;transition:height .3s}
.dig.on{height:44px}
.dig span{display:inline-block;animation:dg .5s ease-in-out infinite alternate}
.dig span:nth-child(2){animation-delay:.15s}.dig span:nth-child(3){animation-delay:.3s}
@keyframes dg{0%{transform:rotate(-20deg) translateY(-4px)}100%{transform:rotate(15deg) translateY(4px)}}
.tr2{margin-top:10px;font-size:24px;font-weight:900;color:var(--navy);opacity:0;transform:scale(1.6);transition:all .35s cubic-bezier(.2,1.6,.4,1)}
.tr2.on{opacity:1;transform:none}
.tr2 b{background:linear-gradient(transparent 55%,#ffd27a 55%)}
.cf{position:fixed;top:-20px;width:9px;height:14px;z-index:6;pointer-events:none;animation:cf var(--d) linear forwards}
@keyframes cf{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--x),110vh) rotate(720deg)}}
#toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);background:#fff;color:var(--navy);font-weight:900;padding:16px 20px;border-radius:10px;z-index:60;box-shadow:0 20px 40px rgba(0,0,0,.4);text-align:center;line-height:1.45;display:none;width:max-content;max-width:300px}
</style>
</head>
<body>
<div id="app"></div>
<script src="../_shared/kit.js"></script>
<script>
const A = [70, 62], B = [292, 228], M = [181, 145];
K.start({
  parse: a => ({ to: K.str(a[0], '친구', 10), toT: K.str(a[1], '강남', 8), fr: K.str(a[2], '나', 10), frT: K.str(a[3], '홍대', 8) }),
  make: () => K.maker({
    kicker: '약속장소 결정', title: '약속장소 국토교통부', sub: '공정한 중간 지점을 국책 사업으로 정합니다.',
    fields: [
      { k: 'to', label: '받는 사람', ph: '영집', max: 10, def: '친구' },
      { k: 'toT', label: '받는 사람 동네', ph: '강남', max: 8, def: '강남' },
      { k: 'fr', label: '보내는 사람', ph: '현우', max: 10, def: '나' },
      { k: 'frT', label: '보내는 사람 동네', ph: '홍대', max: 8, def: '홍대' },
    ],
    toArr: v => [v.to, v.toT, v.fr, v.frT],
  }),
  show,
});

function show(d){
  const E = K.esc, to = E(d.to), fr = E(d.fr), now = new Date();
  document.getElementById('app').innerHTML =
    '<div id="gate"><div class="pr"><p class="k"><span>보도자료</span><b>즉시 보도</b></p><h1>약속장소<br>국토교통부</h1>' +
    '<p class="t">' + fr + '·' + to + ' 약속장소 국책 사업<br>최종 입지 발표</p>' +
    '<p class="rw"><b>배포</b>' + (now.getMonth() + 1) + '월 ' + now.getDate() + '일</p><p class="rw"><b>담당</b>중간지점정책과</p>' +
    '<button id="enter">브리핑 시청</button></div></div>' +
    '<div id="stage"><div id="bar"><span class="lv"><i></i>LIVE</span><span class="tt">정책 브리핑 · 약속장소 국토교통부</span></div>' +
    '<div id="hd"><p>국책 사업 발표</p><h2>' + fr + '·' + to + ' 약속장소 최종 입지</h2></div>' +
    '<div id="map"><svg viewBox="0 0 362 290" preserveAspectRatio="xMidYMid slice"><g id="mg">' +
      '<defs><pattern id="gr" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#d9cfb4" stroke-width="1"/></pattern></defs>' +
      '<rect x="-200" y="-200" width="800" height="700" fill="url(#gr)"/>' +
      '<path d="M-40 175 C 40 120, 120 175, 181 145 S 300 105, 420 150" fill="none" stroke="#3f8fd0" stroke-width="44" stroke-linecap="round" opacity=".35"/>' +
      '<path d="M-40 175 C 40 120, 120 175, 181 145 S 300 105, 420 150" fill="none" stroke="var(--river)" stroke-width="34" stroke-linecap="round"/>' +
      '<path d="M-40 175 C 40 120, 120 175, 181 145 S 300 105, 420 150" fill="none" stroke="#fff" stroke-width="1.2" stroke-dasharray="6 10" opacity=".7"/>' +
      '<text x="300" y="118" font-size="10" font-weight="800" fill="#2a6aa0" font-family="Pretendard,sans-serif">강</text>' +
      '<path id="lnm" d="M' + A + ' L' + B + '" stroke="var(--navy)" stroke-width="2.5" stroke-dasharray="400" fill="none"/>' +
      '<g class="pt" id="pa"><circle cx="' + A[0] + '" cy="' + A[1] + '" r="9" fill="var(--a)" stroke="#fff" stroke-width="3"/><text x="' + (A[0] + 14) + '" y="' + (A[1] - 8) + '" font-size="13" font-weight="900" fill="#111" font-family="Pretendard,sans-serif">' + E(d.frT) + ' (' + fr + ')</text></g>' +
      '<g class="pt" id="pb"><circle cx="' + B[0] + '" cy="' + B[1] + '" r="9" fill="var(--b)" stroke="#fff" stroke-width="3"/><text x="' + (B[0] - 12) + '" y="' + (B[1] + 26) + '" text-anchor="end" font-size="13" font-weight="900" fill="#111" font-family="Pretendard,sans-serif">' + E(d.toT) + ' (' + to + ')</text></g>' +
      '<g id="q"><circle cx="' + M[0] + '" cy="' + M[1] + '" r="11" fill="var(--orange)" stroke="#fff" stroke-width="3"/><text x="' + M[0] + '" y="' + (M[1] + 5) + '" text-anchor="middle" font-size="14" font-weight="900" fill="#fff" font-family="Pretendard,sans-serif">?</text></g>' +
      '<g id="rips"></g></g></svg><span class="tag" id="tag">입지 분석 중</span><div id="pin">📍</div></div>' +
    '<div id="pan"></div></div><div id="toast"></div>';
  K.footer({ dark: true });
  K.$('#enter').onclick = () => { K.unlock(); K.$('#gate').remove(); K.$('#stage').classList.add('on'); run(d); };
}

const blip = (f = 880) => { K.tone(f, .06, { type: 'sine', vol: .16 }); K.tone(f * 1.5, .08, { type: 'sine', vol: .1, at: .05 }); };

async function run(d){
  const S = K.sleep, E = K.esc, to = E(d.to), fr = E(d.fr), pan = K.$('#pan'), tag = K.$('#tag');
  // 지도
  await S(500);
  K.$('#pa').classList.add('on'); blip(660); await S(500);
  K.$('#pb').classList.add('on'); blip(880); await S(500);
  K.$('#lnm').classList.add('on'); for (let i = 0; i < 10; i++) K.tick({ f: 1200 + i * 60, at: i * .1 });
  await S(1150); K.$('#q').classList.add('on'); K.tone(520, .12, { type: 'square', vol: .08 }); K.tone(780, .2, { type: 'square', vol: .08, at: .12 });
  tag.textContent = '중간 지점 산정 중';
  // 공정성 지표
  const IX = ['환승 횟수', '이동 시간', '기분', '맛집 밀도', '막차 시간'];
  pan.innerHTML = '<div class="ix"><h4>공정성 지표 산정<span id="fs">0.0</span></h4>' + IX.map(t => '<div class="ir"><span>' + t + '</span><div class="tr"><i style="width:50%"></i><b></b></div></div>').join('') +
    '<p class="lg"><span class="x">● ' + E(d.frT) + ' (' + fr + ')</span><span class="y">' + E(d.toT) + ' (' + to + ') ●</span></p></div>';
  const bars = K.$$('.ir .tr i'), fs = K.$('#fs');
  for (let k = 0; k < 11; k++) {
    bars.forEach(b => b.style.width = K.rand(18, 82) + '%');
    fs.textContent = K.rand(20, 80).toFixed(1); K.tick({ f: 900 + K.rand(0, 600) }); K.noise(.04, { bp: 1500, vol: .1 });
    await S(260);
  }
  bars.forEach(b => b.style.width = '50%'); fs.textContent = '100.0'; K.ding({ f: 1046, vol: .25 });
  await S(1100);
  // 발표
  tag.textContent = '최종 입지';
  K.$('#q').classList.remove('on'); K.$('#q').style.opacity = 0;
  K.$('#mg').classList.add('zoom'); K.noise(1.2, { lp: 600, vol: .25, curve: 'flat' });
  pan.innerHTML = '';
  await S(1300);
  const pin = K.$('#pin'); pin.classList.add('drop'); K.tone(1400, .5, { type: 'sine', vol: .15, slide: 300 });
  await S(560);
  K.noise(.7, { hp: 600, vol: .5 }); K.noise(.4, { lp: 500, vol: .5 }); K.tone(220, .3, { type: 'sine', vol: .3, slide: 90 });
  const rips = K.$('#rips'); for (let i = 0; i < 3; i++) setTimeout(() => { rips.insertAdjacentHTML('beforeend', '<ellipse class="rip" cx="' + M[0] + '" cy="' + (M[1] + 2) + '" rx="10" ry="4"/>'); }, i * 260);
  pin.classList.remove('drop'); pin.classList.add('sink');
  pan.innerHTML = '<div class="ann"><small>공정한 중간 지점</small><h3>한강 한가운데</h3><p class="dp">(수심 4m)</p>' +
    '<div class="tape" id="tape"><i></i><i></i><em>✂️</em></div><div class="dig" id="dig"><span>🪏</span><span>🪏</span><span>🪏</span></div>' +
    '<p class="tr2" id="tr2">교통편: <b>수영</b> 🏊</p></div>';
  K.boom({ vol: .6, f: 100, d: .5 });
  await S(1500);
  // 착공식
  const tape = K.$('#tape'); tape.classList.add('go'); K.noise(.5, { bp: 800, vol: .15 });
  await S(650);
  tape.classList.add('cut'); K.noise(.05, { hp: 3000, vol: .6 }); K.noise(.05, { hp: 3000, vol: .6, at: .25 });
  for (let i = 0; i < 24; i++) K.noise(.05, { bp: K.rand(1200, 2600), q: 1, vol: .35, at: .3 + i * K.rand(.04, .09) });   // 박수
  for (let i = 0; i < 30; i++) { const c = document.createElement('div'); c.className = 'cf'; c.style.left = K.rand(0, 100) + '%'; c.style.background = K.pick(['#F28C28', '#fff', '#5AA9E6', '#F2C14E']); c.style.setProperty('--x', K.rand(-60, 60) + 'px'); c.style.setProperty('--d', K.rand(2.2, 3.4) + 's'); c.style.animationDelay = K.rand(0, .5) + 's'; document.body.appendChild(c); setTimeout(() => c.remove(), 4200); }
  await S(700); K.$('#dig').classList.add('on'); for (let i = 0; i < 4; i++) K.noise(.12, { lp: 700, vol: .45, at: i * .3 });
  await S(1300);
  K.$('#tr2').classList.add('on'); K.boom({ vol: .7, f: 90, d: .4 }); K.tone(784, .1, { type: 'triangle', vol: .2, at: .1 }); K.tone(1046, .3, { type: 'triangle', vol: .2, at: .2 });
  await S(1500);
  K.again({ replayText: '이의 신청', makeText: '나도 입지 발표하기', onReplay: () => {
    const t = K.$('#toast'); t.innerHTML = '이의 신청은 수상 민원실에서<br>접수합니다'; t.style.display = 'block'; K.noise(.4, { hp: 600, vol: .3 });
    setTimeout(() => { t.style.display = 'none'; K.$('.k-again').classList.add('on'); }, 2200); } });
}
</script>
</body>
</html>
