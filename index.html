<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오늘 만든 쓸데없는 것</title>
<meta name="description" content="AI로 쓸데없는 걸 진지하게 만듭니다. 지금까지 만든 앱 모음.">
<meta property="og:title" content="오늘 만든 쓸데없는 것">
<meta property="og:description" content="AI로 쓸데없는 걸 진지하게 만듭니다. 지금까지 만든 앱 모음.">
<meta property="og:image" content="https://brooksglobal.github.io/useless-things/apps/answer-box/cover.jpg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--lime:#D9FF3D;--lime2:#C4EC27;--ink:#111;--card:#fff;--muted:#6b6b63;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{background:linear-gradient(180deg,#E4FF57 0%,#D6FA3A 45%,#C4EC27 100%) fixed;min-height:100%}
body{font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;color:var(--ink);word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;
  padding:max(20px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
.wrap{max-width:520px;margin:0 auto}
.dots{position:fixed;inset:0;background-image:radial-gradient(rgba(0,0,0,.08) 1.2px,transparent 1.3px);background-size:24px 24px;pointer-events:none}
header{position:relative;text-align:center;padding:18px 0 22px}
.av{display:block;margin:0 auto;width:92px;height:92px;border-radius:50%;background:#fff;object-fit:cover;box-shadow:0 8px 24px rgba(0,0,0,.18);border:4px solid #111}
.pill{display:inline-block;margin-top:14px;background:#111;color:var(--lime);font-weight:800;font-size:13px;letter-spacing:.08em;padding:7px 14px;border-radius:999px}
h1{font-size:30px;font-weight:900;letter-spacing:-.03em;margin-top:12px;line-height:1.2}
.sub{margin-top:8px;font-size:15px;color:#2b2b25;line-height:1.5}
.list{position:relative;display:flex;flex-direction:column;gap:14px}
.card{display:flex;gap:14px;align-items:stretch;background:var(--card);border-radius:22px;padding:12px;text-decoration:none;color:inherit;
  box-shadow:0 10px 24px rgba(40,60,0,.18);border:3px solid #111;transition:transform .15s}
.card:active{transform:scale(.98)}
.thumb{width:96px;flex:none;aspect-ratio:3/4;border-radius:14px;background:#111 center/cover;position:relative;overflow:hidden}
.num{position:absolute;left:6px;top:6px;background:var(--lime);color:#111;font-weight:900;font-size:12px;padding:3px 7px;border-radius:999px}
.info{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0}
.info b{font-size:20px;font-weight:900;letter-spacing:-.02em}
.info p{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.45}
.go{margin-top:10px;display:inline-flex;gap:6px;align-items:center;align-self:flex-start;background:#111;color:var(--lime);font-weight:800;font-size:14px;padding:8px 14px;border-radius:999px}
.soon{border-style:dashed;background:rgba(255,255,255,.6);box-shadow:none}
.soon .thumb{background:repeating-linear-gradient(45deg,#e9e9e2 0 10px,#f4f4ef 10px 20px);display:grid;place-items:center;font-size:30px}
.soon .go{background:transparent;color:#111;border:2px solid #111}
footer{position:relative;margin-top:26px;display:flex;justify-content:center}
.ig{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:#111;font-weight:800;font-size:15px;padding:8px 16px 8px 8px;border-radius:999px;background:#fff;border:3px solid #111}
.ig img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.ig svg{width:20px;height:20px}
.req{position:relative;margin-top:14px;text-align:center;font-size:14px;color:#2b2b25}
</style>
</head>
<body>
<div class="dots"></div>
<div class="wrap">
  <header>
    <img class="av" src="apps/_shared/avatar.png" alt="">
    <div class="pill">USELESS THINGS</div>
    <h1>오늘 만든 쓸데없는 것</h1>
    <p class="sub">AI로 쓸데없는 걸 진지하게 만듭니다 🛠<br>친구한테 링크 보내서 놀려 보세요</p>
  </header>

  <main class="list" id="list"></main>

  <footer>
    <a class="ig" href="https://www.instagram.com/ax.king.brooks/" target="_blank" rel="noopener"><img src="apps/_shared/avatar.png" alt=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>@ax.king.brooks</a>
  </footer>
  <p class="req">만들어 줬으면 하는 거 있으면 DM 주세요 💬</p>
</div>

<script>
// 새 앱이 생기면 이 배열 맨 위에 한 줄 추가합니다.
const APPS = [
  { n: 4, name: '로또 1등 퇴사 리허설', desc: '로또 되면 퇴사한다는 친구에게 리허설을 시켜 드려요. 친구 이름이랑 회사 이름만 적으면 돼요 🎱',
    url: 'apps/lotto-quit/', cover: 'apps/lotto-quit/cover.jpg', label: '열기' },
  { n: 3, name: '「언제 밥 한번」 국무회의', desc: '밥 약속 날짜를 국무회의에서 정해 드려요. 친구 이름이랑 먹을 것만 적으면 돼요 🏛️',
    url: 'apps/bab-cabinet/', cover: 'apps/bab-cabinet/cover.jpg', label: '열기' },
  { n: 2, name: '끝없는 언박싱', desc: '포장이 좀 많은 선물. 받는 사람 이름이랑 맨 안쪽에 넣을 말만 적으면 돼요 🎁',
    url: 'apps/unbox/', cover: 'apps/unbox/cover.jpg', label: '열기' },
  { n: 1, name: '대답 상자', desc: '거창한 대답이 필요할 때. 답 적고 시상식🏆·로켓🚀 고르면 링크가 생겨요.',
    url: 'https://box.brooksglobal.deno.net', cover: 'apps/answer-box/cover.jpg', label: '열기' },
];
const SOON = { name: '다음 거 만드는 중', desc: '뭐 만들지 댓글로 정해 주세요 👀' };

const list = document.getElementById('list');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
list.innerHTML =
  `<div class="card soon"><div class="thumb">🛠</div><div class="info"><b>${esc(SOON.name)}</b><p>${esc(SOON.desc)}</p>
   <a class="go" href="https://www.instagram.com/ax.king.brooks/" target="_blank" rel="noopener">댓글 남기러 가기</a></div></div>` +
  APPS.map(a => `<a class="card" href="${a.url}"><div class="thumb" style="background-image:url('${a.cover}')"><span class="num">#${a.n}</span></div>
    <div class="info"><b>${esc(a.name)}</b><p>${esc(a.desc)}</p><span class="go">${esc(a.label)} →</span></div></a>`).join('');
</script>
</body>
</html>
